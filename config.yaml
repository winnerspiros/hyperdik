# HYPERDIK — Feature Toggles
# Copy to config.yaml and edit. All values shown are defaults.

# ── AI Models ──
ai:
  enabled: true                     # Master switch — disables ALL AI (coin picks, sizing, exits, evolution)
  openrouter_key_env: "OPENROUTER_API_KEY"

# ── Trading ──
trading:
  enabled: true                     # Execute real orders. Set false for dry-run/watch-only.
  max_positions: 3
  base_leverage: 6
  position_size_pct: 0.20           # 20% of equity per position

# ── Post-Trade Analysis ──
analysis:
  enabled: true                     # AI analyzes every closed trade (web search, background thread)
  model: "openai/gpt-4.1"

# ── Evolution (autonomous optimizer) ──
evolution:
  enabled: true                     # Every ~1.7h: AI reads all data, suggests code/prompt changes
  model: "openai/gpt-4.1"          # GPT-4.1 — 1M context, best code gen
  apply_changes: true               # Actually write changes to files (set false for suggest-only)
  auto_restart: false                # DISABLED — evolution restart broken, spawns infinite lock-failed processes
  auto_git: true                    # Git commit after each evolution run

# ── Prompt Optimizer ──
prompt_optimizer:
  enabled: true                     # Meta-prompts AI to improve trading prompts every ~200 cycles
  min_trials: 30                    # Minimum trades before optimizing prompts

# ── Entry ──
entry:
  micro_peak: true                  # 150ms WebSocket sampling for 4s before market entry
  vwap_chase_block: true            # Block entries far from VWAP

# ── Exit ──
exit:
  never_green_ai_recheck: true      # Ask AI before killing flat positions (extends 300s→600s)
  breakeven_lock: true              # Move SL to entry once net ≥ fees
  trend_kill: true                  # Close positions with 4h strongly against
  bleed_detection: true             # Close positions where peak is dropping + momentum turning
  take_profit: false                # Fixed TP orders OFF — winners run until trend reversal (5% or 5000%)
  # ── v4 exit (Aug 14): bank peaks + protect runner — all ATR-scaled, no hardcoded price % ──
  chandelier_trail: true            # Wire the ATR chandelier trail to the exchange (cancel+replace SL)
  trail_atr_timeframe: "5m"         # Volatility window for trail/scale-out (5m = engages on micro moves)
  scale_out: true                   # Bank partial profit at confirmed peak reversals while green
  scale_out_pct: 0.5                # Fraction banked at each peak (position fraction, not a price %)
  scale_out_retr_atr: 0.75          # Reversal threshold in trail-ATR units (0.75× ATR(5m) retrace)
  ai_peak_classify: true            # AI tiebreak on borderline peak reversals (0.4–0.75× ATR)

# ── Monitoring ──
monitoring:
  log_level: "INFO"                 # DEBUG, INFO, WARNING, ERROR
  cycle_seconds: 3                    # Main loop interval (default: 3s)